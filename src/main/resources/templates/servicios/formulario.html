<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Servicio · Citafy</title>
</head>
<body>
<section>
    <h1 class="h3 mb-3">Servicio</h1>

    <form th:action="@{/servicios/guardar}" th:object="${servicio}" method="post"
          class="card card-body">
        <input type="hidden" name="id" th:value="${idEdicion}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                 th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Duración (minutos)</label>
            <input type="number" class="form-control" th:field="*{duracionMinutos}"
                   th:classappend="${#fields.hasErrors('duracionMinutos')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('duracionMinutos')}"
                 th:errors="*{duracionMinutos}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" class="form-control" th:field="*{precio}"
                   th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}"
                 th:errors="*{precio}"></div>
        </div>

        <div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/servicios}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>
