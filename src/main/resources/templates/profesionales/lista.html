
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Profesionales - Citafy</title>
</head>
<body>
<section>

	<div class="d-flex justify-content-between align-items-center mb-4">

	    <h2 th:text="${negocioActivo.etiquetaProfesional == 'Doctor' ? 'Doctores' : negocioActivo.etiquetaProfesional + 's'}">

	        Profesionales

	    </h2>

        <a th:href="@{/profesionales/nuevo}" class="btn btn-primary">
            + Nuevo profesional
        </a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success"
         th:text="${mensaje}"></div>

    <div th:if="${error}" class="alert alert-danger"
         th:text="${error}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered bg-white">
            <thead class="table-light">
                <tr>
                    <th>Nombre</th>
                    <th>Especialidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="p : ${profesionales}">
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.especialidad}"></td>
                    <td>
                        <a th:href="@{/profesionales/editar/{id}(id=${p.id})}"
                           class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <form th:action="@{/profesionales/eliminar/{id}(id=${p.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('¿Deseas eliminar este profesional?');">
                            <button class="btn btn-danger btn-sm">
                                Eliminar
                            </button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(profesionales)}">
                    <td colspan="3" class="text-center">
                        No hay profesionales registrados.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>

</section>
</body>
</html>
