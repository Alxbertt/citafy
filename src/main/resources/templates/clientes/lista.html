<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Clientes · Citafy</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Clientes</h1>
        <a th:href="@{/clientes/nuevo}" class="btn btn-primary">Nuevo cliente</a>
    </div>

    <table class="table table-striped table-bordered bg-white">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.telefono}"></td>
                <td th:text="${c.correo}"></td>
                <td>
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/clientes/{id}/editar(id=${c.id})}">Editar</a>
                    <form class="d-inline" method="post"
                          th:action="@{/clientes/{id}/eliminar(id=${c.id})}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</section>
</body>
</html>
