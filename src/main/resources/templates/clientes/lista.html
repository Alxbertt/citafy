<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
</head>
<body>
    <h1>Clientes</h1>
		<a th:href="@{/clientes/nuevo}">Nuevo cliente</a>
    <table border="1">
        <thead>
            <tr><th>Nombre</th><th>Teléfono</th><th>Correo</th></tr>
        </thead>
        <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.telefono}"></td>
                <td th:text="${c.correo}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
