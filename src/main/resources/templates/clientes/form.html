<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo cliente</title>
</head>
<body>
    <h1>Nuevo cliente</h1>
    <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
				<input type="hidden" th:field="*{id}">
        <div>
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}">
            <span style="color:red" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
        </div>
        <div>
            <label>Teléfono</label>
            <input type="text" th:field="*{telefono}">
            <span style="color:red" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></span>
        </div>
        <div>
            <label>Correo</label>
            <input type="text" th:field="*{correo}">
            <span style="color:red" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></span>
        </div>
        <button type="submit">Guardar</button>
        <a th:href="@{/clientes}">Cancelar</a>
    </form>
</body>
</html>
